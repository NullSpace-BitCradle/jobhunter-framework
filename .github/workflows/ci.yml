name: CI

# Runs the discovery test suite on Linux, macOS and Windows. The suite is fully
# mocked and tests/conftest.py fails any real socket connection, so CI never
# touches a live job site or ATS API.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is the documented minimum (python-jobspy requires it). 3.14 is the
        # newest release with a PyYAML wheel on Windows; move to 3.15 once
        # PyYAML publishes one (building it needs the MSVC build tools).
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: discovery
    steps:
      # Actions are pinned to full commit SHAs (tag noted in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: discovery/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
